<!-- A closure is the combination of a function bundled together (enclosed) with references to its surrounding 
state (the lexical environment). In other words, a closure gives a function access to its outer scope. 
In JavaScript, closures are created every time a function is created, at function creation time. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closure</title>
</head>

<body style="background-color: #313131;">
    <button id="orange">Orange</button>
    <button id="green">Green</button>
</body>

<script>
    // Lexical scoping: 

    // function init() {
    //     let name = "Mozilla";
    //     function displayName() {
    //         console.log(name);
    //     }
    //     displayName();
    // }
    // init();

    // init() creates a local variable called name and a function called displayName(). The displayName() 
    // function is an inner function that is defined inside init() and is available only within the body of the
    // init() function. Note that the displayName() function has no local variables of its own. However, since 
    // inner functions have access to the variables of outer scopes, displayName() can access the variable name
    // declared in the parent function, init()

    // function outer(){
    //     let username = "aalok"
    //     console.log("OUTER", secret);
    //     function inner(){
    //         let secret = "my123"
    //         console.log("inner", username);
    //     }
    //     function innerTwo(){
    //         console.log("innerTwo", username);
    //         console.log(secret);
    //     }
    //     inner()
    //     innerTwo()

    // }
    // outer()
    // console.log("TOO OUTER", username);

    function makeFunc() {
        const name = "Mozilla";
        function displayName() {
            console.log(name);
        }
        return displayName;
    }

    const myFunc = makeFunc();
    myFunc();

    // Running this code has exactly the same effect as the previous example of the init() function above. 
    // What's different (and interesting) is that the displayName() inner function is returned from the outer 
    // function before being executed.

    // but the code still works as expected:
    // The reason is that functions in JavaScript form closures. A closure is the combination of a function and the 
    // lexical environment within which that function was declared. This environment consists of any variables that 
    // were in-scope at the time the closure was created. 
    
    // In this case, myFunc is a reference to the instance of the function displayName that is created when makeFunc
    // is run. The instance of displayName maintains a reference to its lexical environment, within which the 
    // variable name exists. For this reason, when myFunc is invoked, the variable name remains available for use, 
    // and "Mozilla" is passed to console.log.

</script>

<script>
    // document.getElementById("orange").onclick = function(){
    //     document.body.style.backgroundColor = `orange`
    // }

    // document.getElementById("green").onclick = function(){
    //     document.body.style.backgroundColor = `green`
    // }

    function clickHandler(color){
        // document.body.style.backgroundColor = `${color}`

        return function(){
            document.body.style.backgroundColor = `${color}`
        }
    }

    document.getElementById('orange').onclick = clickHandler("orange")
    document.getElementById('green').onclick = clickHandler("green")
</script>

</html>
